<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Main Bubbles Monitor</title>
    <link href="{{ url_for('static', path='/css/bootstrap.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', path='/css/bmon.css') }}" rel="stylesheet">
</head>
<body>
<h1>Main Bubbles Monitor[{{i}}]</h1>

<div id="container" class="container-fluid">
    <div class="row">
        <table id="module1" class="logmodule table" data-module="col1,col2,col3">
            <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col">First</th>
                <th scope="col">Last</th>
                <th scope="col">Handle</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <th scope="row">1</th>
                <td>Mark</td>
                <td>Otto</td>
                <td>@mdo</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="{{ url_for('static', path='/js/bootstrap.bundle.min.js') }}"></script>
<script src="{{ url_for('static', path='/js/jquery-3.6.1.min.js') }}"></script>
<script src="{{ url_for('static', path='/js/bmon.js') }}"></script>
<script>
    $(document).ready(function() {

        var modules = {
            'logmodule': $.fn.bmon.module.logmodule
        }

        var bmon = $.fn.bmon.bubble_monitor($('#container'), modules);

        //  Connect websocket
        var ws = new WebSocket(location.origin.replace(/^http/, 'ws') + "/ws");
        ws.onmessage = function(event) {
            bmon.onmessage(event.data)
        }

        // connect timer
        setInterval(()=>{
            bmon.timer();
        }, 1000);
    });
</script>

</body>
</html>
